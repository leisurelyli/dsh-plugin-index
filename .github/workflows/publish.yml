name: Build & Publish DSH Plugin Index

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at 03:30 UTC (11:30 CST) so newly published plugin versions & download counts stay fresh
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: .plugin-market-cache
          key: dsh-index-cache-${{ hashFiles('plugins.txt', 'overrides.json') }}
          restore-keys: |
            dsh-index-cache-

      - name: Build Format-1 index & static catalog
        run: npm run build
        # Optional: uncomment to also collect `github_stars` sortKey using the built-in token
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate & test generated site/
        run: npm test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # -----------------------------------------------------------------------
      # Alternative Hosting Notes (Aliyun OSS / Cloudflare Pages):
      #
      # 1. Cloudflare Pages:
      #    - Connect this repository in Cloudflare Pages dashboard.
      #    - Build command: `npm run build && npm test`
      #    - Build output directory: `site`
      #    - Node version env var: `NODE_VERSION=24`
      #
      # 2. Aliyun OSS (阿里云对象存储 + CDN):
      #    - Add secrets: OSS_ENDPOINT, OSS_BUCKET, OSS_ACCESS_KEY_ID, OSS_ACCESS_KEY_SECRET
      #    - Replace the `deploy` job with ossutil sync:
      #        ossutil cp -rf site/ oss://${{ secrets.OSS_BUCKET }}/dsh-market/ --update
      #    - Ensure `index.json` serves HTTP 200 directly (no redirect) with
      #      `Content-Type: application/json; charset=utf-8` and `Access-Control-Allow-Origin: *`.
      # -----------------------------------------------------------------------

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
