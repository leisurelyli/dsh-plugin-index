name: Build & Publish DSH Plugin Index (Aliyun OSS)

on:
  push:
    branches: [main]
  schedule:
    # Daily refresh at 03:30 UTC (11:30 CST) so newly published plugin versions & download counts stay fresh
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and print the OSS upload plan without writing to Aliyun OSS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-oss
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore generator cache
        uses: actions/cache@v4
        with:
          path: .plugin-market-cache
          key: dsh-index-cache-${{ hashFiles('plugins.txt', 'overrides.json') }}
          restore-keys: |
            dsh-index-cache-

      - name: Build Format-1 index & static catalog
        run: npm run build
        # Optional: uncomment to also collect `github_stars` sortKey using the built-in token
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate & test generated site/
        run: npm test

      - name: Publish site/ to Aliyun OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          MINDECK_OSS_BUCKET: ${{ vars.MINDECK_OSS_BUCKET }}
          MINDECK_OSS_REGION: ${{ vars.MINDECK_OSS_REGION }}
          DSH_INDEX_OSS_PREFIX: ${{ vars.DSH_INDEX_OSS_PREFIX }}
          DSH_INDEX_PUBLIC_BASE_URL: ${{ vars.DSH_INDEX_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run publish:oss:dry
          else
            npm run publish:oss
          fi
